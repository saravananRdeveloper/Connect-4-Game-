<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecter Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Connect Four <i class="fas fa-circle"></i></h1>
            <div class="game-info">
                <div class="player player1">
                    <span class="name">Player 1</span>
                    <div class="token red"></div>
                </div>
                <div class="turn-indicator">
                    <span id="currentPlayer">Player 1's Turn</span>
                </div>
                <div class="player player2">
                    <span class="name">Player 2</span>
                    <div class="token yellow"></div>
                </div>
            </div>
        </header>

        <div class="game-board" id="gameBoard">
            <!-- Board will be generated by JavaScript -->
        </div>

        <div class="controls">
            <button id="resetBtn" class="reset-btn">
                <i class="fas fa-redo"></i> New Game
            </button>
            <div class="score-board">
                <div class="score">
                    <span>Player 1:</span>
                    <span id="player1Score">0</span>
                </div>
                <div class="score">
                    <span>Player 2:</span>
                    <span id="player2Score">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <h2 id="winnerMessage"></h2>
            <div class="winner-token"></div>
            <button onclick="startNewGame()" class="new-game-btn">
                Play Again
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
